version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
    open-pull-requests-limit: 10
    labels:
      - security
      - technical-debt
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - security
      - technical-debt
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule:
      interval: weekly
    labels:
      - security
      - technical-debt
    commit-message:
      prefix: build

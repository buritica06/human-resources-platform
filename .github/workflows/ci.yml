name: CI — Integración Continua

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Formato y Convención de Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

      - name: Verificar formato Prettier
        run: npm run format:check

      - name: Validar Conventional Commits en PR
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  test-sqlite:
    name: Pruebas y Cobertura ≥ 80% (SQLite)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar directorio de cobertura
        run: mkdir -p coverage

      - name: Ejecutar suite completa con cobertura (umbral 80%)
        run: npm run test:coverage

      - name: Subir reporte de cobertura LCOV
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  test-postgres:
    name: Pruebas de Integración (PostgreSQL 17)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: th_user
          POSTGRES_PASSWORD: th_ci_password
          POSTGRES_DB: th_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar suite contra PostgreSQL 17
        env:
          TEST_DATABASE_URL: postgres://th_user:th_ci_password@localhost:5432/th_pruebas
        run: npm run test:pg

  docker-build:
    name: Verificación de Build Docker
    runs-on: ubuntu-latest
    needs: [test-sqlite, test-postgres]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen de producción (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

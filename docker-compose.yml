# Despliegue con PostgreSQL (opcional). Uso:
#   1. Copie .env.example a .env y complete: DATA_ENCRYPTION_KEY, APP_URL (https), SMTP_*, POSTGRES_PASSWORD.
#   2. docker compose up -d
#   3. docker compose exec app node scripts/crear-admin.js <cedula> "<NOMBRE>"
# La app migra la base al arrancar. Ponga un proxy con HTTPS delante (ver docs/despliegue.md).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: talento_humano
      POSTGRES_USER: talento_humano
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talento_humano -d talento_humano"]
      interval: 10s
      retries: 5

  app:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_CLIENT: pg
      DATABASE_URL: postgres://talento_humano:${POSTGRES_PASSWORD}@db:5432/talento_humano
      TRUST_PROXY: ${TRUST_PROXY:-1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"   # solo local: el proxy HTTPS publica el servicio
    volumes:
      - archivos:/app/uploads
      - respaldos:/app/backups

volumes:
  datos_pg:
  archivos:
  respaldos:
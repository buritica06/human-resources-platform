# Fly.io — Configuración de despliegue productivo (Node.js + PostgreSQL)
# Uso:
#   fly launch --no-deploy --copy-config
#   fly postgres create --name hr-platform-db && fly postgres attach hr-platform-db
#   fly volumes create hr_uploads --size 1
#   fly secrets set DATA_ENCRYPTION_KEY=<64-hex> APP_URL=https://<tu-app>.fly.dev SMTP_HOST=... SMTP_USER=... SMTP_PASS=...
#   fly deploy

app = "human-resources-platform"
primary_region = "bog"

[build]
  dockerfile = "infrastructure/docker/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_CLIENT = "pg"
  DB_SSL = "true"
  TRUST_PROXY = "1"
  MAIL_TRANSPORT = "smtp"
  STORAGE_DRIVER = "local"
  STORAGE_DIR = "/app/uploads"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/v1/auth/csrf"

[[mounts]]
  source = "hr_uploads"
  destination = "/app/uploads"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

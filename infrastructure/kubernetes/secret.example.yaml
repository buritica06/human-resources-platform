# Plantilla de Secret de Kubernetes.
# NUNCA versione valores reales. Gestione los secretos con External Secrets Operator, Sealed Secrets o Vault.
apiVersion: v1
kind: Secret
metadata:
  name: hr-platform-secrets
type: Opaque
stringData:
  APP_URL: "https://th.empresa.example.com"
  DATABASE_URL: "postgres://talento_humano:CHANGE_ME@postgres:5432/talento_humano"
  DATA_ENCRYPTION_KEY: "REPLACE_WITH_64_HEX_CHARS"
  MAIL_FROM: "Talento Humano <no-responder@empresa.example.com>"
  SMTP_HOST: "smtp.empresa.example.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: "REPLACE_ME"
  SMTP_PASS: "REPLACE_ME"

# Render Blueprint — Despliegue en 1 clic (App Docker + PostgreSQL 17)
# Uso: https://render.com/deploy?repo=https://github.com/buritica06/human-resources-platform

databases:
  - name: hr-platform-db
    databaseName: talento_humano
    user: talento_humano
    plan: free
    postgresMajorVersion: '17'

services:
  - type: web
    name: human-resources-platform
    runtime: docker
    dockerfilePath: ./infrastructure/docker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/auth/csrf
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3000'
      - key: DB_CLIENT
        value: pg
      - key: DB_SSL
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: hr-platform-db
          property: connectionString
      - key: TRUST_PROXY
        value: '1'
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_DIR
        value: /app/uploads
      - key: MAIL_TRANSPORT
        value: smtp
      - key: MODULES_ENABLED
        value: auth,usuarios,colaboradores,nomina,notificaciones,solicitudes,permisos,vacaciones,incapacidades,licencias,certificados,admin
      # Completar en el dashboard de Render antes de iniciar:
      # DATA_ENCRYPTION_KEY: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: MAIL_FROM
        value: 'Talento Humano <no-responder@example.com>'
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
